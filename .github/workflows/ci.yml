name: CI
on:
  push:
    branches: [main]
    paths: ["src/**", "tests/**", "requirements.txt", "pyproject.toml", ".github/workflows/**"]
  pull_request:
  workflow_dispatch:
    inputs:
      study:
        description: "Bounded sensitivity study, original full reference, or both"
        type: choice
        options: [sensitivity, reference, all]
        default: sensitivity
permissions:
  contents: read
concurrency:
  group: benchmark-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pip install --no-deps -e .
      - run: python -m pytest -q
      - name: Run benchmark integration smoke
        run: hvac-benchmark --suite smoke --output results/reference-smoke --time-limit 1
      - name: Run sensitivity integration smoke
        run: hvac-benchmark sensitivity --stage smoke --output results/sensitivity-smoke --no-plots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-results
          path: results/
          if-no-files-found: ignore
  sensitivity:
    needs: test
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.study != 'reference')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pip install --no-deps -e .
      - name: Run staged bounded sensitivity study
        run: hvac-benchmark sensitivity --stage all --output reports/sensitivity-run
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sensitivity-results
          path: reports/sensitivity-run/
          if-no-files-found: ignore
  benchmark:
    needs: test
    if: github.event_name == 'workflow_dispatch' && (inputs.study == 'reference' || inputs.study == 'all')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pip install --no-deps -e .
      - name: Run original full reference matrix
        run: hvac-benchmark --suite full --output results --time-limit 0.5
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: full-results
          path: results/
          if-no-files-found: ignore
